name: kinohub-stack
x-common: &common
  restart: unless-stopped
  networks: [kinohub]
  profiles: [full]

services:
  kinohub:
    <<: *common
    build: { context: ., dockerfile: Dockerfile }
    image: kinohub-tv:local
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4100
      APP_MODE: ${APP_MODE:-unconfigured}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-http://127.0.0.1:4100}
      SEERR_URL: http://seerr:5055
      JACKETT_URL: http://jackett:9117
      PUBLIC_JACKETT_URL: http://jackett:9117
      TORRSERVER_URL: http://torrserver:8090
      JELLYFIN_URL: http://jellyfin:8096
    ports: ["${LAN_BIND:-127.0.0.1}:${KINOHUB_PORT:-4100}:4100"]
    depends_on:
      seerr: { condition: service_healthy }
      jackett: { condition: service_healthy }
      torrserver: { condition: service_healthy }
      jellyfin: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    environment: { LOG_LEVEL: info, TZ: "${TZ:-Etc/UTC}", PORT: "5055" }
    ports: ["${ADMIN_BIND:-127.0.0.1}:${SEERR_PORT:-5055}:5055"]
    volumes: [seerr-config:/app/config]
    depends_on:
      jellyfin: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  jackett:
    <<: *common
    image: lscr.io/linuxserver/jackett:latest
    environment: { PUID: "${PUID:-1000}", PGID: "${PGID:-1000}", TZ: "${TZ:-Etc/UTC}" }
    ports: ["${ADMIN_BIND:-127.0.0.1}:${JACKETT_PORT:-9117}:9117"]
    volumes: [jackett-config:/config]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9117/UI/Dashboard >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  torrserver:
    <<: *common
    image: ghcr.io/yourok/torrserver:latest
    environment: { TS_PORT: "8090", TS_PATH: /opt/ts, TS_DONTKILL: "1", TS_HTTPAUTH: "0" }
    ports: ["${LAN_BIND:-127.0.0.1}:${TORRSERVER_PORT:-8090}:8090"]
    volumes: [torrserver-data:/opt/ts]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  jellyfin:
    <<: *common
    image: jellyfin/jellyfin:latest
    user: "${PUID:-1000}:${PGID:-1000}"
    ports: ["${ADMIN_BIND:-127.0.0.1}:${JELLYFIN_PORT:-8096}:8096"]
    volumes: [jellyfin-config:/config, jellyfin-cache:/cache]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  kinohub: { name: kinohub-stack }
volumes:
  seerr-config:
  jackett-config:
  torrserver-data:
  jellyfin-config:
  jellyfin-cache:
