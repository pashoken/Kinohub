name: kinohub

services:
  kinohub:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${KINOHUB_IMAGE:-kinohub-tv:local}
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4100
      APP_MODE: ${APP_MODE:-live}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LAN_BIND:-0.0.0.0}:${KINOHUB_PORT:-4100}:4100"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
