name: kinohub-seerr
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-Etc/UTC}
      PORT: 5055
    ports:
      - "127.0.0.1:${SEERR_PORT:-5055}:5055"
    volumes:
      - seerr-data:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

volumes:
  seerr-data:
