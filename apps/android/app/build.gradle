plugins {
    id "com.android.application"
}

android {
    namespace "ru.kinohub.tv"
    compileSdk 35

    defaultConfig {
        applicationId "ru.kinohub.tv"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "KinoHub_URL", '"http://192.168.0.120:4100/"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
